[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-runpod-mlops"
version = "0.1.0"
description = "Python-managed llama.cpp inference deployment for Qwen3.8-27B-GGUF on RunPod GPU"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "GitHub Copilot" }]
dependencies = [
  "pydantic>=2.8.2",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "runpod>=1.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.4",
]

[project.scripts]
qwen-worker = "app.serverless_handler:start"
qwen-health = "app.health:main"

[tool.setuptools]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
